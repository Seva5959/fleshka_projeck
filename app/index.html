<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OfflineTube</title>
<style>
:root{--bg:#f6f4f0;--panel:#ebe8e2;--ink:#1d1b19;--mute:#6d6862;--acc:#c2261f;--line:#d9d5ce}
@media(prefers-color-scheme:dark){:root{--bg:#171615;--panel:#211f1d;--ink:#eeeae4;--mute:#9a948c;--acc:#ff5a4f;--line:#35322f}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
nav{width:210px;background:var(--panel);padding:18px 12px;position:sticky;top:0;height:100vh;flex-shrink:0}
.logo{font-weight:700;font-size:19px;padding:4px 12px 18px}.logo b{color:var(--acc)}
nav a{display:block;padding:10px 12px;border-radius:8px;color:var(--ink);text-decoration:none;margin-bottom:2px}
nav a:hover{background:var(--line)}nav a.on{background:var(--ink);color:var(--bg)}
main{flex:1;padding:24px 28px;min-width:0}
h1{margin:0 0 18px;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px 16px}
.card{cursor:pointer}
.thumb{aspect-ratio:16/9;background:var(--panel);border-radius:10px;overflow:hidden}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.card h3{margin:8px 0 2px;font-size:14px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card small{color:var(--mute)}
.pl .thumb{box-shadow:6px -6px 0 -2px var(--line)}
.player video{width:100%;max-height:72vh;background:#000;border-radius:10px;display:block}

/* ——— страница видео в стиле YouTube ——— */
.vtitle{margin:14px 0 0;font-size:20px;font-weight:700;line-height:1.3}
.vrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px;margin:12px 0}
.chan{display:flex;align-items:center;gap:12px;min-width:0}
.ava{width:40px;height:40px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px;flex-shrink:0}
.chan b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border:0;border-radius:18px;background:var(--panel);color:var(--ink);font-weight:600;font-size:14px}
.pill:hover{background:var(--line)}
.pill svg{width:20px;height:20px;fill:currentColor;flex-shrink:0}
.pill.sq{padding:0 12px}
.pill.liked{background:var(--ink);color:var(--bg)}
button:disabled{opacity:.5;cursor:default}
.savewrap{position:relative}
.menu{position:absolute;right:0;top:42px;width:290px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.28);z-index:20;padding:6px 0}
.menu[hidden]{display:none}
.menu h4{margin:0;padding:10px 16px 8px;font-size:15px}
.mi{display:flex;gap:14px;align-items:center;padding:8px 16px;cursor:pointer}
.mi:hover{background:var(--line)}
.mi input{width:18px;height:18px;accent-color:var(--acc);margin:0;flex-shrink:0}
.mi span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mnew{display:flex;gap:8px;border-top:1px solid var(--line);margin-top:6px;padding:10px 12px 6px}
.mnew input{flex:1;min-width:0;font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.dbox{background:var(--panel);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:14px}
.dbox:hover{background:var(--line)}
.dstat{font-weight:700}
.dtext{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:6px}
.dbox:not(.open) .dtext{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.more{display:inline-block;margin-top:6px;font-weight:700}
.more[hidden]{display:none}
@media(max-width:600px){.vtitle{font-size:18px}}

#chp{margin-top:12px}
.chnow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.chnow b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chbar{display:flex;gap:3px;height:16px;align-items:center}
.seg{position:relative;height:100%;display:flex;align-items:center;cursor:pointer;min-width:2px}
.sb{width:100%;height:5px;background:var(--line);border-radius:3px;overflow:hidden;transition:height .1s}
.seg:hover .sb{height:10px}
.sb i{display:block;height:100%;width:0;background:var(--acc)}
.seg:hover::after{content:attr(data-t);position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:4px 8px;border-radius:6px;font-size:12px;white-space:nowrap;z-index:5;pointer-events:none}
.chlist{max-height:240px;overflow:auto;margin-top:10px;border-radius:10px;background:var(--panel)}
.chi{display:flex;gap:12px;padding:8px 12px;cursor:pointer}.chi:hover,.chi.cur{background:var(--line)}
.chi span{color:var(--acc);min-width:56px;font-variant-numeric:tabular-nums}
.watch{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start}
.qpanel{background:var(--panel);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 48px);position:sticky;top:24px;overflow:hidden}
.qh{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.qh h2{margin:0 0 2px;font-size:17px;line-height:1.3}.qh small{color:var(--mute)}
.qb{display:flex;gap:8px;margin-top:10px}
.ic{width:40px;height:34px;padding:0;display:grid;place-items:center}
.ic svg{width:20px;height:20px;fill:currentColor}
.ic.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ql{overflow:auto;position:relative;flex:1}
.qi{display:flex;gap:10px;align-items:center;padding:8px 12px 8px 4px;cursor:pointer}
.qi:hover{background:var(--line)}.qi.cur{background:var(--line);box-shadow:inset 3px 0 var(--acc)}
.qi .n{width:24px;text-align:center;color:var(--mute);font-size:12px;flex-shrink:0}
.qt{width:112px;aspect-ratio:16/9;background:var(--bg);border-radius:6px;overflow:hidden;flex-shrink:0}
.qt img{width:100%;height:100%;object-fit:cover;display:block}
.qm{min-width:0}.qm b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;font-weight:600}
.qm small{color:var(--mute);font-size:12px}
@media(max-width:1000px){.watch{grid-template-columns:1fr}.qpanel{position:static;max-height:460px}}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 14px;border-radius:20px;cursor:pointer}
.head{display:flex;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap}.head h1{margin:0}
.dl textarea{width:100%;min-width:0;resize:vertical;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.dl{background:var(--panel);border-radius:12px;padding:16px;margin-bottom:24px;max-width:760px}
.dl .row{display:flex;gap:10px;margin-bottom:10px;align-items:center}
.dl input[type=text]{flex:1;font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.dl label{display:block;color:var(--mute);margin-bottom:10px}
.dl .state{margin:8px 0 6px;font-weight:600}.dl .err{color:var(--acc)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc)}
.log{max-height:170px;overflow:auto;font:12px/1.4 Consolas,monospace;color:var(--mute);white-space:pre-wrap;margin:10px 0 0}
.empty{color:var(--mute);padding:40px 0;max-width:46ch}
a.back{color:var(--mute);text-decoration:none}

/* ——— Shorts ——— */
.sfeed{height:calc(100vh - 130px);min-height:420px;max-width:420px;margin:0 auto;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
.sfeed::-webkit-scrollbar{display:none}
.sh{height:100%;padding-bottom:12px;scroll-snap-align:start;scroll-snap-stop:always}
.shbox{position:relative;height:100%;background:#000;border-radius:14px;overflow:hidden}
.shbox video{width:100%;height:100%;object-fit:contain;display:block;cursor:pointer}
.sinfo{position:absolute;left:0;right:0;bottom:0;padding:48px 76px 16px 14px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.72));display:flex;flex-direction:column;gap:3px;pointer-events:none}
.sinfo span{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sact{position:absolute;right:10px;bottom:18px}
.sact .pill{background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(6px)}
.sact .pill.liked{background:#fff;color:#000}

/* Дополнительные инструменты плеера */
.player-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}
.speed-select{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--ink);font:inherit;cursor:pointer}
.tool-btn{height:36px}
.share-note{font-size:12px;color:var(--mute);min-height:18px}

/* Shorts: видео, панель действий и отдельная навигация */
.shorts-shell{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:18px;align-items:center;max-width:760px;margin:0 auto}
.sfeed{height:calc(100vh - 130px);min-height:420px;width:100%;max-width:520px;margin:0 auto;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.sfeed::-webkit-scrollbar{display:none}
.sh{height:100%;min-height:420px;padding-bottom:12px;scroll-snap-align:start;scroll-snap-stop:always;display:grid;grid-template-columns:minmax(0,1fr) 58px;gap:10px;align-items:center}
.shbox{position:relative;height:100%;min-width:0;background:#000;border-radius:14px;overflow:hidden}
.shbox video{width:100%;height:100%;object-fit:contain;display:block;cursor:pointer}
.sinfo{position:absolute;left:0;right:0;bottom:0;padding:48px 14px 16px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.76));display:flex;flex-direction:column;gap:3px;pointer-events:none}
.sinfo span{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sh-actions{display:flex;flex-direction:column;align-items:center;gap:10px;position:relative}
.sh-actions .action{width:48px;min-height:48px;padding:5px;border:0;border-radius:50%;background:var(--panel);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;line-height:1.1}
.sh-actions .action svg{width:21px;height:21px;fill:currentColor}
.sh-actions .action.liked{background:var(--acc);color:#fff}
.sh-actions .action span{max-width:54px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-actions .speed-select{width:58px;height:30px;padding:0 3px;font-size:11px;border-radius:10px}
.shdesc{position:absolute;z-index:8;left:10px;right:10px;bottom:74px;max-height:48%;overflow:auto;padding:12px;background:rgba(20,20,20,.94);color:#fff;border-radius:10px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.shdesc[hidden]{display:none}
.shsave-menu{position:absolute;right:56px;top:50%;transform:translateY(-50%);width:260px;max-height:65%;overflow:auto}
.short-nav{display:flex;flex-direction:column;gap:12px;align-items:center;position:sticky;top:42vh}
.short-nav button{width:46px;height:46px;padding:0;border-radius:50%;font-size:22px;display:grid;place-items:center}
@media(max-width:700px){
 .shorts-shell{grid-template-columns:minmax(0,1fr) 42px;gap:6px}
 .sfeed{height:calc(100vh - 150px);min-height:360px}
 .sh{grid-template-columns:minmax(0,1fr) 44px;gap:5px}
 .sh-actions{gap:7px}
 .sh-actions .action{width:40px;min-height:42px;font-size:9px}
 .sh-actions .action svg{width:18px;height:18px}
 .short-nav button{width:38px;height:38px}
}
@media(max-width:700px){nav{width:64px}nav a{font-size:0}.logo{font-size:0}}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style></head><body>
<nav>
  <div class="logo">Offline<b>Tube</b></div>
  <a href="#/home" data-r="home">Главная</a>
  <a href="#/shorts" data-r="shorts">Shorts</a>
  <a href="#/playlists" data-r="playlists">Плейлисты</a>
  <a href="#/liked" data-r="liked">Понравившиеся</a>
</nav>
<main id="view"></main>
<script>
function pref(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}}
const WL='Смотреть позже';
let queue={ctx:null,title:'',order:[]}, pageCtx=null, startCtx=null, curR='';
let shuffleOn=pref('ot_shuffle')==='1', repeatOn=pref('ot_repeat')==='1';
let lib={playlists:[]}, likes=[], cols=[], shorts=[];
let dlTimer=null, dlOpen=false, dlSt={status:'idle',lines:[]}, seenSeq=0, dlUrl='', dlThumbs=false, dlErr='';
const $=s=>document.querySelector(s), view=$('#view');
const all=()=>lib.playlists.flatMap(p=>p.videos);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const go=(kind,x)=>{location.hash='#/'+kind+'/'+encodeURIComponent(x)};

/* ——— форматирование как на YouTube ——— */
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const d=n%10;return n>10&&n<20?c:d===1?a:d>1&&d<5?b:c};
const compact=n=>{n=Number(n);return n<1000?n.toLocaleString('ru-RU'):new Intl.NumberFormat('ru-RU',{notation:'compact',maximumFractionDigits:1}).format(n)};
const viewsText=(n,full)=>{n=Number(n);
  if(full||n<1000) return n.toLocaleString('ru-RU')+' '+plural(n,'просмотр','просмотра','просмотров');
  return compact(n)+' просмотров'};
const dateObj=s=>{s=String(s||'');return /^\d{8}$/.test(s)?new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8)):null};
const relDate=s=>{const d=dateObj(s);if(!d)return '';
  const days=Math.floor((Date.now()-d)/864e5), rtf=new Intl.RelativeTimeFormat('ru',{numeric:'auto'});
  if(days<1)return 'сегодня';
  if(days<7)return rtf.format(-days,'day');
  if(days<30)return rtf.format(-Math.floor(days/7),'week');
  if(days<365)return rtf.format(-Math.floor(days/30),'month');
  return rtf.format(-Math.floor(days/365),'year')};
const fullDate=s=>{const d=dateObj(s);return d?d.toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'}):''};
const likeLabel=(base,liked)=>base==null?(liked?'1':'Нравится'):compact(Number(base)+(liked?1:0));

const IC_LIKE='<svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>';
const IC_SAVE='<svg viewBox="0 0 24 24"><path d="M14 10H2v2h12v-2zm0-4H2v2h12V6zm4 8v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zM2 16h8v-2H2v2z"/></svg>';
const IC_PREV='<svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>';
const IC_NEXT='<svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>';
const IC_REPEAT='<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>';
const IC_SHUFFLE='<svg viewBox="0 0 24 24"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>';

async function init(){
  try{
    lib=await (await fetch('/api/library')).json();
    likes=await (await fetch('/api/likes')).json();
    try{cols=await (await fetch('/api/collections')).json()}catch(e){cols=[]}
    if(!Array.isArray(cols)) cols=[];
    if(!cols.some(c=>c.name===WL)) cols.unshift({name:WL,ids:[]});
    try{seenSeq=(await (await fetch('/api/download/status')).json()).seq}catch(e){}
  }catch(e){view.innerHTML='<p class="empty">Нет связи с запускалкой. Откройте приложение через «Запустить.bat».</p>';return}
  route();
}
const saveLikes=()=>fetch('/api/likes',{method:'POST',body:JSON.stringify(likes)});
const saveCols=()=>fetch('/api/collections',{method:'POST',headers:{'Content-Type':'application/json','X-OfflineTube':'1'},body:JSON.stringify(cols)});

function card(v){
  return `<div class="card" data-watch="${esc(v.id)}">
    <div class="thumb"><img loading="lazy" src="${v.thumb}" alt="" onerror="this.remove()"></div>
    <h3>${esc(v.title)}</h3><small>${esc(v.playlist)}</small></div>`;
}
const grid=(vs,msg)=>vs.length?`<div class="grid">${vs.map(card).join('')}</div>`:`<p class="empty">${msg}</p>`;
const byIdMap=()=>Object.fromEntries(all().map(v=>[v.id,v]));
const colVideos=c=>{const m=byIdMap();return c.ids.map(i=>m[i]).filter(Boolean)};

const pages={
  // TODO: что показывать на главной (недавние, случайные, продолжить просмотр)
  home:()=>`<h1>Главная</h1>`+grid(all(),'Видео пока нет. Положите папки плейлистов в папку videos.'),
  shorts:()=>`<div class="head"><h1>Shorts</h1><button id="shgo">Скачать новые Shorts из кэша Firefox</button></div><div id="dl"></div><div id="shfeed"></div>`,
  playlists:()=>`<div class="head"><h1>Плейлисты</h1><button id="add">+ Добавить плейлист</button></div><div id="dl"></div>`+
    `<div class="grid">`+lib.playlists.map(p=>
    `<div class="card pl" data-playlist="${esc(p.name)}">
     <div class="thumb">${p.videos[0]?`<img loading="lazy" src="${p.videos[0].thumb}" alt="" onerror="this.remove()">`:''}</div>
     <h3>${esc(p.name)}</h3><small>${p.videos.length} видео</small></div>`).join('')+
    cols.map(c=>{const vs=colVideos(c);
     return `<div class="card pl" data-collection="${esc(c.name)}">
     <div class="thumb">${vs[0]?`<img loading="lazy" src="${vs[0].thumb}" alt="" onerror="this.remove()">`:''}</div>
     <h3>${esc(c.name)}</h3><small>Мой плейлист · ${vs.length} видео</small></div>`}).join('')+`</div>`+
    (lib.playlists.length?'':`<p class="empty">Скачанных плейлистов пока нет. Нажмите «Добавить плейлист» и вставьте ссылку.</p>`),
  liked:()=>`<h1>Понравившиеся</h1>`+grid(all().filter(v=>likes.includes(v.id)),'Нажмите «Нравится» под видео, и оно появится здесь.'),
};

function playlist(name){
  const p=lib.playlists.find(p=>p.name===name); if(!p) return pages.playlists();
  pageCtx={kind:'p',name};
  return `<a class="back" href="#/playlists">← Плейлисты</a><h1>${esc(p.name)}</h1>`+grid(p.videos,'Пусто.');
}
function collection(name){
  const c=cols.find(c=>c.name===name); if(!c) return pages.playlists();
  pageCtx={kind:'c',name};
  return `<a class="back" href="#/playlists">← Плейлисты</a>
    <div class="head" style="margin-top:8px"><h1>${esc(c.name)}</h1>${name!==WL?'<button id="cdel">Удалить плейлист</button>':''}</div>`+
    grid(colVideos(c),'В этом плейлисте пока пусто. Нажмите «Сохранить» под видео.');
}
function bindCollection(name){
  const b=$('#cdel'); if(!b) return;
  b.onclick=()=>{if(!confirm('Удалить плейлист «'+name+'»? Сами видео останутся на диске.')) return;
    cols=cols.filter(c=>c.name!==name); saveCols(); location.hash='#/playlists'};
}

/* ——— очередь: папка-плейлист или мой плейлист ——— */
const plList=name=>(lib.playlists.find(p=>p.name===name)||{videos:[]}).videos;
const ctxIds=c=>{
  if(!c) return [];
  if(c.kind==='c') return colVideos(cols.find(x=>x.name===c.name)||{ids:[]}).map(v=>v.id);
  return plList(c.name).map(x=>x.id);
};
function shuffled(ids,first){
  const r=ids.filter(x=>x!==first);
  for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}
  return first?[first,...r]:r;
}
function buildQueue(v){
  const c=(startCtx&&ctxIds(startCtx).includes(v.id))?startCtx:{kind:'p',name:v.playlist};
  startCtx=null;
  const ids=ctxIds(c);
  queue={ctx:c,title:c.name,order:shuffleOn?shuffled(ids,v.id):ids};
}
function nextId(id,dir){
  const o=queue.order,j=o.indexOf(id)+dir;
  if(j>=0&&j<o.length) return o[j];
  return repeatOn?o[(j+o.length)%o.length]:null;
}
function panel(id){
  const byId=byIdMap();
  const pos=queue.order.indexOf(id);
  const items=queue.order.filter(vid=>byId[vid]).map((vid,i)=>{const x=byId[vid];
    return `<div class="qi${vid===id?' cur':''}" data-watch="${esc(vid)}"><span class="n">${vid===id?'▶':i+1}</span>
      <div class="qt"><img loading="lazy" src="${x.thumb}" alt="" onerror="this.remove()"></div>
      <div class="qm"><b>${esc(x.title)}</b><small>${esc(x.playlist)}</small></div></div>`}).join('');
  return `<div class="qh"><h2>${esc(queue.title)}</h2><small>${pos+1} из ${queue.order.length}</small>
    <div class="qb">
      <button id="rp" class="ic${repeatOn?' on':''}" title="Повторять плейлист" aria-pressed="${repeatOn}">${IC_REPEAT}</button>
      <button id="sh" class="ic${shuffleOn?' on':''}" title="Перемешать" aria-pressed="${shuffleOn}">${IC_SHUFFLE}</button>
    </div></div><div class="ql" id="ql">${items}</div>`;
}

function watch(id){
  const v=all().find(v=>v.id===id); if(!v) return pages.home();
  if(!queue.ctx||!queue.order.includes(id)||queue.order.length!==ctxIds(queue.ctx).length) buildQueue(v);
  const channel=v.uploader||'Канал не указан';
  const liked=likes.includes(id);
  const saved=cols.some(c=>c.ids.includes(id));
  return `<div class="watch"><div class="player">
    <video id="pv" src="${v.url}" controls autoplay preload="auto"></video>
    <div class="player-tools">
      <label>Скорость <select id="pv-speed" class="speed-select" aria-label="Скорость воспроизведения">
        ${[0.25,0.5,0.75,1,1.25,1.5,1.75,2].map(x=>`<option value="${x}">${x}×</option>`).join('')}
      </select></label>
      <button id="pv-full" class="tool-btn">⛶ Полный экран</button>
      <button id="pv-share" class="tool-btn">↗ Поделиться</button>
      <span id="pv-share-note" class="share-note" aria-live="polite"></span>
    </div>
    <p id="err" class="empty" hidden></p>
    <div id="chp" hidden></div>
    <h1 class="vtitle">${esc(v.title)}</h1>
    <div class="vrow">
      <div class="chan"><div class="ava">${esc(channel.charAt(0).toUpperCase())}</div><b>${esc(channel)}</b></div>
      <div class="acts">
        <button id="lk" class="pill${liked?' liked':''}" aria-pressed="${liked}">${IC_LIKE}<span id="lktxt">${esc(likeLabel(v.youtube_likes,liked))}</span></button>
        <div class="savewrap">
          <button id="sv" class="pill">${IC_SAVE}<span id="svtxt">${saved?'Сохранено':'Сохранить'}</span></button>
          <div id="svm" class="menu" hidden></div>
        </div>
        <button id="pr" class="pill sq" title="Предыдущее" aria-label="Предыдущее">${IC_PREV}</button>
        <button id="nx" class="pill sq" title="Следующее" aria-label="Следующее">${IC_NEXT}</button>
      </div>
    </div>
    <section class="dbox" id="dbox">
      <div class="dstat" id="dstat"></div>
      <div class="dtext" id="dtext">${esc(v.description||'Описание не сохранено. Чтобы получить его, скачайте информацию о плейлисте ещё раз с включённым сохранением info.json.')}</div>
      <span class="more" id="dmore">…ещё</span>
    </section>
  </div><aside class="qpanel" id="qp">${panel(id)}</aside></div>`;
}
function bindPanel(id){
  const ql=$('#ql'), cur=ql.querySelector('.cur'); if(cur) ql.scrollTop=cur.offsetTop-8;
  const refresh=()=>{$('#qp').innerHTML=panel(id);bindPanel(id)};   // видео не перезапускается
  $('#rp').onclick=()=>{repeatOn=!repeatOn;pref('ot_repeat',repeatOn?'1':'0');refresh()};
  $('#sh').onclick=()=>{shuffleOn=!shuffleOn;pref('ot_shuffle',shuffleOn?'1':'0');
    const ids=ctxIds(queue.ctx);
    queue.order=shuffleOn?shuffled(ids,id):ids;refresh()};
}
const fmt=t=>{t=Math.floor(t);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;
  return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')};
async function drawChapters(id,pv){
  let ch=[];
  try{ch=(await (await fetch('/api/chapters?id='+encodeURIComponent(id))).json()).chapters||[]}catch(e){}
  const box=$('#chp'); if(!ch.length||!box||!document.body.contains(pv)) return;
  box.hidden=false;
  box.innerHTML=`<div class="chnow"><b id="chname"></b><button id="chtog">Эпизоды (${ch.length})</button></div>
    <div class="chbar">${ch.map((c,i)=>`<div class="seg" data-i="${i}" data-t="${fmt(c.start)} ${esc(c.title)}" style="flex:${c.end-c.start}"><div class="sb"><i></i></div></div>`).join('')}</div>
    <div class="chlist" hidden>${ch.map((c,i)=>`<div class="chi" data-i="${i}"><span>${fmt(c.start)}</span><b>${esc(c.title)}</b></div>`).join('')}</div>`;
  const segs=[...box.querySelectorAll('.seg')], rows=[...box.querySelectorAll('.chi')], list=box.querySelector('.chlist');
  $('#chtog').onclick=()=>{list.hidden=!list.hidden};
  segs.forEach((sg,i)=>sg.onclick=e=>{const r=sg.getBoundingClientRect(),c=ch[i];
    pv.currentTime=c.start+Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*(c.end-c.start);pv.play()});
  rows.forEach((rw,i)=>rw.onclick=()=>{pv.currentTime=ch[i].start;pv.play()});
  const upd=()=>{if(!document.body.contains(pv)||!$('#chname'))return;const t=pv.currentTime;let cur=0;
    ch.forEach((c,i)=>{if(t>=c.start)cur=i;
      segs[i].firstChild.firstChild.style.width=Math.min(100,Math.max(0,(t-c.start)/(c.end-c.start)*100))+'%'});
    $('#chname').textContent=ch[cur].title;
    rows.forEach((r,i)=>r.classList.toggle('cur',i===cur))};
  pv.addEventListener('timeupdate',upd);pv.addEventListener('seeked',upd);upd();
}

/* ——— меню «Сохранить» ——— */
function updateSv(id){const t=$('#svtxt'); if(t) t.textContent=cols.some(c=>c.ids.includes(id))?'Сохранено':'Сохранить'}
function drawSave(id){
  const m=$('#svm'); if(!m) return;
  m.innerHTML=`<h4>Сохранить в…</h4>`+
    cols.map((c,i)=>`<label class="mi"><input type="checkbox" data-c="${i}" ${c.ids.includes(id)?'checked':''}><span>${esc(c.name)}</span></label>`).join('')+
    `<div class="mnew"><input type="text" id="cnew" placeholder="Новый плейлист" maxlength="60"><button id="cadd">Создать</button></div>`;
  m.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.onchange=()=>{
    const c=cols[+cb.dataset.c];
    c.ids=cb.checked?[...new Set([...c.ids,id])]:c.ids.filter(x=>x!==id);
    saveCols(); updateSv(id)});
  const add=()=>{const n=$('#cnew').value.trim();
    if(!n||cols.some(c=>c.name.toLowerCase()===n.toLowerCase())) return;
    cols.push({name:n,ids:[id]}); saveCols(); updateSv(id); drawSave(id)};
  $('#cadd').onclick=add;
  $('#cnew').onkeydown=e=>{if(e.key==='Enter') add()};
}
document.addEventListener('click',e=>{
  const m=$('#svm'); if(m&&!m.hidden&&!e.target.closest('.savewrap')) m.hidden=true;
});

async function copyShareLink(url, note){
  const link=new URL(url,location.href).href;
  try{
    if(navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(link);
    else{
      const ta=document.createElement('textarea');ta.value=link;
      ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);
      ta.select();const ok=document.execCommand('copy');ta.remove();
      if(!ok) throw new Error('copy failed');
    }
    if(note) note.textContent='Ссылка скопирована';
    return true;
  }catch(e){
    if(note) note.textContent='Не удалось скопировать ссылку';
    return false;
  }
}
const SPEEDS=[0.25,0.5,0.75,1,1.25,1.5,1.75,2];
const getSpeed=()=>Number(pref('ot_speed')||'1');
function applySpeed(video,select){
  const speed=getSpeed();video.playbackRate=speed;
  if(select) select.value=String(speed);
}

function bindWatch(id){
  const v=all().find(v=>v.id===id); if(!v) return;
  const pv=$('#pv');
  const dbox=$('#dbox'), dtext=$('#dtext'), dmore=$('#dmore'), dstat=$('#dstat');
  let open=false;
  const isLong=dtext.scrollHeight>dtext.clientHeight+1;
  const statText=()=>{const p=[];
    if(v.views!=null) p.push(viewsText(v.views,open));
    const d=open?fullDate(v.upload_date):relDate(v.upload_date); if(d) p.push(d);
    return p.length?p.join('\u00a0\u00a0'):'Статистика YouTube не сохранена'};
  const sync=()=>{dbox.classList.toggle('open',open);dstat.textContent=statText();
    dmore.hidden=!isLong;dmore.textContent=open?'Свернуть':'…ещё'};
  dbox.onclick=()=>{open=!open;sync()};
  sync();
  const speed=$('#pv-speed'); applySpeed(pv,speed);
  speed.onchange=()=>{pv.playbackRate=Number(speed.value);pref('ot_speed',speed.value)};
  $('#pv-full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else (pv.requestFullscreen||pv.webkitEnterFullscreen||pv.webkitRequestFullscreen)?.call(pv)};
  $('#pv-share').onclick=()=>copyShareLink(v.url,$('#pv-share-note'));
  pv.onerror=()=>{const e=$('#err');e.hidden=false;
    e.textContent='Браузер не смог воспроизвести этот файл (код '+(pv.error?.code||'?')+'). Чаще всего причина в кодеке (AV1/VP9). Перекачайте видео в H.264 или конвертируйте через ffmpeg: см. README.'};
  $('#lk').onclick=()=>{const on=!likes.includes(id);
    likes=on?[...likes,id]:likes.filter(x=>x!==id);
    const b=$('#lk'); b.classList.toggle('liked',on); b.setAttribute('aria-pressed',on);
    $('#lktxt').textContent=likeLabel(v.youtube_likes,on); saveLikes()};
  $('#sv').onclick=()=>{const m=$('#svm'); if(m.hidden){drawSave(id);m.hidden=false}else m.hidden=true};
  const step=dir=>{const n=nextId(id,dir); if(!n) return;
    if(n===id){pv.currentTime=0;pv.play()} else go('watch',n)};
  $('#nx').onclick=()=>step(1);
  $('#pr').onclick=()=>step(-1);
  pv.onended=()=>step(1);
  bindPanel(id);
  drawChapters(id,pv);
}

/* ——— Shorts ——— */
function drawShortSaveMenu(menu,id){
  menu.innerHTML=`<h4>Добавить в плейлист</h4>`+
    cols.map((c,i)=>`<label class="mi"><input type="checkbox" data-c="${i}" ${c.ids.includes(id)?'checked':''}><span>${esc(c.name)}</span></label>`).join('')+
    `<div class="mnew"><input type="text" class="snew" placeholder="Новый плейлист" maxlength="60"><button class="screate">Создать</button></div>`;
  menu.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.onchange=()=>{
    const c=cols[+cb.dataset.c];
    c.ids=cb.checked?[...new Set([...c.ids,id])]:c.ids.filter(x=>x!==id);
    saveCols();
  });
  const add=()=>{const n=menu.querySelector('.snew').value.trim();
    if(!n||cols.some(c=>c.name.toLowerCase()===n.toLowerCase())) return;
    cols.push({name:n,ids:[id]});saveCols();drawShortSaveMenu(menu,id)};
  menu.querySelector('.screate').onclick=add;
  menu.querySelector('.snew').onkeydown=e=>{if(e.key==='Enter')add()};
}
async function bindShorts(){
  $('#shgo').onclick=async()=>{dlErr='';
    const r=await dlPost('/api/shorts/download');
    if(!r.ok) dlErr=r.error||'Не удалось начать.';pollDl()};
  pollDl();
  try{shorts=await (await fetch('/api/shorts')).json()}catch(e){shorts=[]}
  const feed=$('#shfeed');if(!feed)return;
  if(!shorts.length){
    feed.innerHTML='<p class="empty">Shorts пока нет. Откройте YouTube в Firefox, пролистайте рекомендации и Shorts, затем нажмите кнопку выше: программа найдёт ролики в кэше браузера и скачает их.</p>';
    return;
  }
  feed.innerHTML=`<div class="shorts-shell">
    <div class="sfeed" id="sfeed">`+shorts.map((s,i)=>{const on=likes.includes(s.id);
      return `<section class="sh" data-index="${i}"><div class="shbox">
        <video src="${s.url}" ${s.poster?`poster="${s.poster}"`:''} loop playsinline preload="none"></video>
        <div class="sinfo"><b>${esc(s.uploader||'')}</b><span>${esc(s.title)}</span></div>
        <div class="shdesc" hidden>${esc(s.description||'Описание не сохранено.')}</div>
      </div>
      <div class="sh-actions">
        <button class="action sl${on?' liked':''}" data-id="${esc(s.id)}" data-base="${s.youtube_likes??''}" title="Нравится">${IC_LIKE}<span>${esc(likeLabel(s.youtube_likes,on))}</span></button>
        <button class="action sshare" title="Скопировать ссылку">↗<span>Поделиться</span></button>
        <button class="action sdescription" title="Описание">☰<span>Описание</span></button>
        <button class="action ssave" title="Добавить в плейлист">＋<span>В плейлист</span></button>
        <button class="action sfull" title="Полный экран">⛶<span>Экран</span></button>
        <label class="action" title="Скорость">↗<span>Скорость</span>
          <select class="speed-select s-speed" aria-label="Скорость Shorts">${SPEEDS.map(x=>`<option value="${x}" ${x===getSpeed()?'selected':''}>${x}×</option>`).join('')}</select>
        </label>
        <div class="menu shsave-menu" hidden></div>
        <span class="share-note s-share-note" aria-live="polite"></span>
      </div></section>`}).join('')+`</div>
    <div class="short-nav"><button id="sh-up" title="Предыдущий Shorts" aria-label="Предыдущий Shorts">↑</button><button id="sh-down" title="Следующий Shorts" aria-label="Следующий Shorts">↓</button></div>
  </div>`;
  const sf=$('#sfeed'), sections=[...sf.querySelectorAll('.sh')];
  const io=new IntersectionObserver(es=>es.forEach(en=>{
    const vd=en.target.querySelector('video');
    if(en.isIntersecting){vd.preload='auto';applySpeed(vd,en.target.querySelector('.s-speed'));vd.play().catch(()=>{})}
    else vd.pause();
  }),{root:sf,threshold:0.65});
  sections.forEach(el=>io.observe(el));
  const move=dir=>{
    const current=sections.findIndex(x=>{const r=x.getBoundingClientRect(),f=sf.getBoundingClientRect();return r.top>=f.top-5&&r.top<f.bottom});
    const next=Math.max(0,Math.min(sections.length-1,(current<0?0:current)+dir));
    sections[next].scrollIntoView({behavior:'smooth',block:'start'});
  };
  $('#sh-up').onclick=()=>move(-1);
  $('#sh-down').onclick=()=>move(1);
  sf.addEventListener('click',async e=>{
    const section=e.target.closest('.sh');if(!section)return;
    const s=shorts[Number(section.dataset.index)];
    const b=e.target.closest('button');
    if(b?.classList.contains('sl')){
      const sid=b.dataset.id,on=!likes.includes(sid);
      likes=on?[...likes,sid]:likes.filter(x=>x!==sid);
      b.classList.toggle('liked',on);
      b.querySelector('span').textContent=likeLabel(b.dataset.base===''?null:b.dataset.base,on);
      saveLikes();return;
    }
    if(b?.classList.contains('sshare')){
      await copyShareLink(s.url,section.querySelector('.s-share-note'));return;
    }
    if(b?.classList.contains('sdescription')){
      const d=section.querySelector('.shdesc');d.hidden=!d.hidden;return;
    }
    if(b?.classList.contains('ssave')){
      const menu=section.querySelector('.shsave-menu');
      if(menu.hidden){drawShortSaveMenu(menu,s.id);menu.hidden=false}else menu.hidden=true;
      return;
    }
    if(b?.classList.contains('sfull')){
      const box=section.querySelector('.shbox');
      if(document.fullscreenElement)document.exitFullscreen?.();
      else (box.requestFullscreen||box.webkitRequestFullscreen)?.call(box);
      return;
    }
    const vd=e.target.closest('video');if(vd)vd.paused?vd.play():vd.pause();
  });
  sf.addEventListener('change',e=>{
    if(e.target.matches('.s-speed')){
      const speed=Number(e.target.value);pref('ot_speed',String(speed));
      sections.forEach(sec=>{const vd=sec.querySelector('video');vd.playbackRate=speed;const sel=sec.querySelector('.s-speed');if(sel)sel.value=String(speed)});
    }
  });
}

/* ——— загрузки ——— */
const NAMES={running:'Скачивание…',done:'Готово',done_with_errors:'Очередь завершена, есть ошибки',error:'Ошибка загрузки',cancelled:'Остановлено'};
const dlPost=(path,body)=>fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-OfflineTube':'1'},body:JSON.stringify(body||{})}).then(r=>r.json());
function drawDl(){
  const box=$('#dl'); if(!box) return;
  const s=dlSt, run=s.status==='running';
  const sb=$('#shgo'); if(sb) sb.disabled=run;
  if(curR==='shorts'){
    const mine=s.kind==='shorts';
    if(!run&&!dlErr&&(!mine||s.status==='idle')){box.innerHTML='';return}
    box.innerHTML=`<div class="dl">
      ${run&&!mine?'<div class="state">Сейчас идёт скачивание плейлиста. Дождитесь окончания.</div>':''}
      ${dlErr?`<div class="state err">${esc(dlErr)}</div>`:''}
      ${mine&&s.status!=='idle'?`<div class="row" style="justify-content:space-between"><div class="state">${NAMES[s.status]||''} ${s.queue_total?`(${s.queue_index||0}/${s.queue_total})`:``} ${esc(s.item||'')}</div>${run?'<button id="dlstop">Остановить</button>':''}</div>
      <div class="prog"><i style="width:${s.percent||0}%"></i></div>
      <pre class="log">${esc((s.lines||[]).slice(-12).join('\n'))}</pre>`:''}</div>`;
    const st=$('#dlstop'); if(st) st.onclick=async()=>{await dlPost('/api/download/cancel'); pollDl()};
    return;
  }
  if(!dlOpen && !run){box.innerHTML='';return}
  box.innerHTML=`<div class="dl">
    <div class="row"><textarea id="dlurl" rows="4" placeholder="Вставь ссылки на плейлисты YouTube — по одной на строку" ${run?'disabled':''}>${esc(run?(s.queue||[]).join("\n"):dlUrl)}</textarea>
    ${run?'<button id="dlstop">Остановить</button>':'<button id="dlgo">Скачать</button>'}</div>
    <label><input type="checkbox" id="dlthumbs" ${(run?s.thumbs_only:dlThumbs)?'checked':''} ${run?'disabled':''}> Только обложки и эпизоды (видео уже скачаны)</label>
    ${dlErr?`<div class="state err">${esc(dlErr)}</div>`:''}
    ${s.status!=='idle'?`<div class="state">${NAMES[s.status]||''} ${s.queue_total?`(${s.queue_index||0}/${s.queue_total})`:``} ${esc(s.item||'')}</div>
    <div class="prog"><i style="width:${s.percent||0}%"></i></div>
    <pre class="log">${esc((s.lines||[]).slice(-12).join('\n'))}</pre>`:''}</div>`;
  const u=$('#dlurl'); if(u&&!run) u.oninput=e=>dlUrl=e.target.value;
  const t=$('#dlthumbs'); if(t&&!run) t.onchange=e=>dlThumbs=e.target.checked;
  const goBtn=$('#dlgo'); if(goBtn) goBtn.onclick=async()=>{
    dlErr=''; const r=await dlPost('/api/download',{url:dlUrl.trim(),thumbs_only:dlThumbs});
    if(!r.ok) dlErr=r.error||'Не удалось начать.'; dlOpen=true; pollDl();};
  const st=$('#dlstop'); if(st) st.onclick=async()=>{await dlPost('/api/download/cancel'); pollDl()};
}
async function pollDl(){
  clearTimeout(dlTimer);
  try{dlSt=await (await fetch('/api/download/status')).json()}catch(e){return}
  if(!$('#dl')) return;                       // ушли со страницы
  if(dlSt.status!=='running' && dlSt.seq!==seenSeq){
    seenSeq=dlSt.seq; lib=await (await fetch('/api/library')).json(); route(); return;
  }
  drawDl();
  if(dlSt.status==='running') dlTimer=setTimeout(pollDl,1500);
}
function bindDl(){
  $('#add').onclick=()=>{dlOpen=!dlOpen;drawDl();if(dlOpen)$('#dlurl')?.focus()};
  pollDl();
}
function route(){
  clearTimeout(dlTimer);
  const m=(location.hash||'#/home').match(/#\/([^/]*)\/?(.*)/)||[,'home',''];
  const r=m[1], a=m[2]?decodeURIComponent(m[2]):'';
  curR=r; pageCtx=null; dlErr='';
  const active=r==='playlist'||r==='collection'?'playlists':r==='watch'?'home':r;
  document.querySelectorAll('nav a').forEach(x=>x.classList.toggle('on',x.dataset.r===active));
  view.innerHTML = r==='watch'?watch(a): r==='playlist'?playlist(a): r==='collection'?collection(a): (pages[r]||pages.home)();
  if(r==='watch') bindWatch(a);
  if(r==='playlists') bindDl();
  if(r==='shorts') bindShorts();
  if(r==='collection') bindCollection(a);
  scrollTo(0,0);
}
view.addEventListener('click',e=>{
  const c=e.target.closest('.card,.qi'); if(!c) return;
  if(c.dataset.watch){
    if(c.classList.contains('card')){queue.ctx=null;startCtx=pageCtx}   // новый заход: очередь из того списка, где кликнули
    go('watch',c.dataset.watch);
  }
  else if(c.dataset.playlist) go('playlist',c.dataset.playlist);
  else if(c.dataset.collection) go('collection',c.dataset.collection);
});
addEventListener('hashchange',route); init();
